<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" aria-hidden="true">
  <!-- Refund Harbor compass rose. currentColor lets the host page recolor it. -->
  <g fill="#b8956b" stroke="#b8956b">
    <!-- Outer ring -->
    <circle cx="20" cy="20" r="17" fill="none" stroke-width="0.75" opacity="0.5"/>
    <!-- Inner ring -->
    <circle cx="20" cy="20" r="13.5" fill="none" stroke-width="0.5" opacity="0.3"/>
    <!-- 4-point cardinal star (N-S-E-W) -->
    <path d="M20 3 L21.5 18.5 L37 20 L21.5 21.5 L20 37 L18.5 21.5 L3 20 L18.5 18.5 Z" stroke="none"/>
    <!-- Diagonal NE/SE/SW/NW tick marks -->
    <line x1="9" y1="9" x2="13" y2="13" stroke-width="0.85" opacity="0.55"/>
    <line x1="31" y1="9" x2="27" y2="13" stroke-width="0.85" opacity="0.55"/>
    <line x1="31" y1="31" x2="27" y2="27" stroke-width="0.85" opacity="0.55"/>
    <line x1="9" y1="31" x2="13" y2="27" stroke-width="0.85" opacity="0.55"/>
    <!-- Center dot -->
    <circle cx="20" cy="20" r="0.9" stroke="none"/>
  </g>
</svg>
