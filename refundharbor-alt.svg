<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-labelledby="rhAltTitle">
  <title id="rhAltTitle">Refund Harbor — Tariff Recovery for U.S. Importers</title>

  <!--
    Refund Harbor — "Mariner's Mark" alternative lockup.

    Composition:
      LEFT  – circular emblem: outer ring + inner hairline, four diagonal
              compass ticks, a horizon line, a 4-point gold north star above
              the horizon, three gold bathymetric depth arcs below.
      RIGHT – REFUND / HARBOR stacked in serif Bold, hairline gold rule,
              "TARIFF RECOVERY · FOR U.S. IMPORTERS" with flanking gold stars.

    Theming:
      All "navy" elements use currentColor so the host page controls them.
      Set color: #0a2540 on cream/white backgrounds, color: #f5f1e8 on the
      dark navy backgrounds — same SVG renders correctly in both.
      Gold (#b8956b) is hard-coded; it reads on both navy and cream.
  -->

  <!-- ============================= MARK ============================= -->
  <g transform="translate(10 10)" stroke="currentColor" fill="currentColor">
    <!-- Outer ring -->
    <circle cx="90" cy="90" r="84" fill="none" stroke-width="2.4"/>
    <!-- Inner hairline ring -->
    <circle cx="90" cy="90" r="76" fill="none" stroke-width="0.6" opacity="0.4"/>

    <!-- Diagonal compass ticks (NE/SE/SW/NW) -->
    <g stroke-width="1.5" stroke-linecap="round" opacity="0.55" fill="none">
      <line x1="40" y1="40" x2="52" y2="52"/>
      <line x1="140" y1="40" x2="128" y2="52"/>
      <line x1="140" y1="140" x2="128" y2="128"/>
      <line x1="40" y1="140" x2="52" y2="128"/>
    </g>

    <!-- Horizon line -->
    <line x1="20" y1="98" x2="160" y2="98" stroke-width="1.5" fill="none"/>

    <!-- North star — 4-point compass rose, gold -->
    <g transform="translate(90 56)" stroke="none">
      <path d="M 0 -34 L 4.5 -4.5 L 34 0 L 4.5 4.5 L 0 34 L -4.5 4.5 L -34 0 L -4.5 -4.5 Z" fill="#b8956b"/>
      <circle r="2.2" fill="currentColor"/>
    </g>

    <!-- Bathymetric arcs below horizon (depth contours), gold -->
    <g fill="none" stroke="#b8956b" stroke-linecap="round">
      <path d="M 28 118 Q 90 152 152 118" stroke-width="1.8" opacity="0.9"/>
      <path d="M 40 132 Q 90 158 140 132" stroke-width="1.5" opacity="0.7"/>
      <path d="M 52 146 Q 90 162 128 146" stroke-width="1.2" opacity="0.5"/>
    </g>
  </g>

  <!-- ====================== WORDMARK + TAGLINE ====================== -->
  <g transform="translate(210 28)" stroke="none">
    <!-- REFUND -->
    <text x="0" y="58"
          font-family="'Source Serif Pro', Georgia, 'Times New Roman', serif"
          font-size="62"
          font-weight="700"
          fill="currentColor"
          letter-spacing="-1.5">REFUND</text>
    <!-- HARBOR -->
    <text x="0" y="124"
          font-family="'Source Serif Pro', Georgia, 'Times New Roman', serif"
          font-size="62"
          font-weight="700"
          fill="currentColor"
          letter-spacing="-1.5">HARBOR</text>

    <!-- Hairline divider in gold -->
    <line x1="0" y1="142" x2="320" y2="142" stroke="#b8956b" stroke-width="0.75" opacity="0.7"/>

    <!-- Tagline with flanking gold stars -->
    <g transform="translate(0 162)">
      <!-- Left star -->
      <g transform="translate(0 -3)" fill="#b8956b">
        <path d="M 0 -3 L 0.6 -0.6 L 3 0 L 0.6 0.6 L 0 3 L -0.6 0.6 L -3 0 L -0.6 -0.6 Z"/>
      </g>
      <text x="10" y="0"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
            font-size="11"
            font-weight="600"
            fill="currentColor"
            letter-spacing="2.6">TARIFF RECOVERY FOR U.S. IMPORTERS</text>
      <!-- Right star -->
      <g transform="translate(316 -3)" fill="#b8956b">
        <path d="M 0 -3 L 0.6 -0.6 L 3 0 L 0.6 0.6 L 0 3 L -0.6 0.6 L -3 0 L -0.6 -0.6 Z"/>
      </g>
    </g>
  </g>
</svg>
