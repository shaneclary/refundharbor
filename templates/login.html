<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DenseWealth — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#161d2f',
              950: '#0b1120',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0b1120; }
    .card { background: #161d2f; border: 1px solid #1e293b; }
  </style>
</head>
<body class="text-slate-300 min-h-screen font-sans flex items-center justify-center">
  <div class="card rounded-2xl p-8 w-full max-w-sm shadow-2xl">
    <h1 class="text-2xl font-bold text-white text-center tracking-widest mb-8">DENSEWEALTH</h1>

    <div id="error" class="hidden mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-xs text-red-400"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <label class="block text-xs text-slate-500 uppercase tracking-wide mb-1">Username</label>
      <input type="text" name="username" required autocomplete="username"
             class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white text-sm mb-4 focus:outline-none focus:border-sky-500" />

      <label class="block text-xs text-slate-500 uppercase tracking-wide mb-1">Password</label>
      <input type="password" name="password" required autocomplete="current-password"
             class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white text-sm mb-6 focus:outline-none focus:border-sky-500" />

      <button type="submit" id="submit-btn"
              class="w-full px-4 py-2.5 rounded-lg bg-sky-600 text-white font-medium hover:bg-sky-500 transition-colors">
        Sign In
      </button>
    </form>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      const btn = document.getElementById('submit-btn');
      const errEl = document.getElementById('error');
      errEl.classList.add('hidden');
      btn.textContent = 'Signing in...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: form.username.value,
            password: form.password.value,
          }),
        });
        const result = await res.json();
        if (result.success) {
          window.location.href = '/';
        } else {
          errEl.textContent = result.error || 'Login failed';
          errEl.classList.remove('hidden');
          btn.textContent = 'Sign In';
          btn.disabled = false;
        }
      } catch (err) {
        errEl.textContent = 'Network error — could not reach server.';
        errEl.classList.remove('hidden');
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
