<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Builder - DenseWealth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0a0f1a', 800: '#111827', 700: '#1a2332', 600: '#243042' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { font-family: 'Inter', system-ui, sans-serif; }
        body { background: linear-gradient(180deg, #0a0f1a 0%, #111827 100%); min-height: 100vh; }
        .collapsible-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .collapsible-content.open { max-height: 2000px; }
    </style>
</head>
<body class="text-white">
    <!-- Header -->
    <header class="sticky top-0 z-40 bg-navy-900/95 backdrop-blur-sm border-b border-slate-700/50">
        <div class="flex items-center justify-between px-4 py-3 max-w-6xl mx-auto">
            <div class="flex items-center gap-3">
                <a href="/" class="text-slate-400 hover:text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                <h1 class="font-semibold text-lg">Strategy Builder</h1>
            </div>
            <button id="newStrategyBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-medium transition-colors">
                + New Strategy
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
        <!-- Strategy List -->
        <div id="strategyList" class="space-y-4 mb-8">
            <div class="text-center text-slate-500 py-12">Loading strategies...</div>
        </div>

        <!-- Active Strategy Details -->
        <div id="strategyDetail" class="hidden">
            <div class="bg-navy-700/30 rounded-xl p-6 mb-6">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h2 id="detailName" class="text-xl font-semibold"></h2>
                        <p id="detailDesc" class="text-sm text-slate-400 mt-1"></p>
                    </div>
                    <div class="flex gap-2">
                        <button id="backToListBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium">
                            Back
                        </button>
                        <button id="runBacktestBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-medium">
                            Run Backtest
                        </button>
                    </div>
                </div>

                <!-- Rules by Type -->
                <div class="space-y-4">
                    <!-- Entry Rules -->
                    <div class="bg-navy-800/50 rounded-lg overflow-hidden">
                        <button class="collapsible-btn w-full px-4 py-3 flex items-center justify-between text-left hover:bg-navy-700/50" data-section="entry">
                            <span class="font-medium text-emerald-400">Entry Rules</span>
                            <svg class="w-5 h-5 text-slate-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </button>
                        <div id="entryRules" class="collapsible-content px-4 pb-4">
                            <div id="entryRulesList" class="space-y-2 mt-2"></div>
                            <button class="add-rule-btn mt-3 text-sm text-blue-400 hover:text-blue-300 flex items-center gap-1" data-type="entry">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                                </svg>
                                Add Entry Rule
                            </button>
                        </div>
                    </div>

                    <!-- Exit Rules -->
                    <div class="bg-navy-800/50 rounded-lg overflow-hidden">
                        <button class="collapsible-btn w-full px-4 py-3 flex items-center justify-between text-left hover:bg-navy-700/50" data-section="exit">
                            <span class="font-medium text-red-400">Exit Rules</span>
                            <svg class="w-5 h-5 text-slate-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </button>
                        <div id="exitRules" class="collapsible-content px-4 pb-4">
                            <div id="exitRulesList" class="space-y-2 mt-2"></div>
                            <button class="add-rule-btn mt-3 text-sm text-blue-400 hover:text-blue-300 flex items-center gap-1" data-type="exit">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                                </svg>
                                Add Exit Rule
                            </button>
                        </div>
                    </div>

                    <!-- Sizing Rules -->
                    <div class="bg-navy-800/50 rounded-lg overflow-hidden">
                        <button class="collapsible-btn w-full px-4 py-3 flex items-center justify-between text-left hover:bg-navy-700/50" data-section="sizing">
                            <span class="font-medium text-blue-400">Sizing Rules</span>
                            <svg class="w-5 h-5 text-slate-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </button>
                        <div id="sizingRules" class="collapsible-content px-4 pb-4">
                            <div id="sizingRulesList" class="space-y-2 mt-2"></div>
                            <button class="add-rule-btn mt-3 text-sm text-blue-400 hover:text-blue-300 flex items-center gap-1" data-type="sizing">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                                </svg>
                                Add Sizing Rule
                            </button>
                        </div>
                    </div>

                    <!-- Risk Rules -->
                    <div class="bg-navy-800/50 rounded-lg overflow-hidden">
                        <button class="collapsible-btn w-full px-4 py-3 flex items-center justify-between text-left hover:bg-navy-700/50" data-section="risk">
                            <span class="font-medium text-amber-400">Risk Rules</span>
                            <svg class="w-5 h-5 text-slate-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </button>
                        <div id="riskRules" class="collapsible-content px-4 pb-4">
                            <div id="riskRulesList" class="space-y-2 mt-2"></div>
                            <button class="add-rule-btn mt-3 text-sm text-blue-400 hover:text-blue-300 flex items-center gap-1" data-type="risk">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                                </svg>
                                Add Risk Rule
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Create Strategy Modal -->
    <div id="createModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-navy-800 rounded-2xl w-full max-w-md shadow-2xl border border-slate-600/30">
            <div class="p-6 border-b border-slate-700/50">
                <h2 class="text-lg font-semibold">New Strategy</h2>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Name</label>
                    <input id="strategyName" type="text" placeholder="My Strategy" class="w-full bg-navy-700 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Description</label>
                    <textarea id="strategyDesc" rows="2" placeholder="Optional description" class="w-full bg-navy-700 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 resize-none"></textarea>
                </div>
            </div>
            <div class="p-6 border-t border-slate-700/50 flex gap-3">
                <button id="cancelCreate" class="flex-1 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-medium transition-colors">Cancel</button>
                <button id="confirmCreate" class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-medium transition-colors">Create</button>
            </div>
        </div>
    </div>

    <!-- Add Rule Modal -->
    <div id="addRuleModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-navy-800 rounded-2xl w-full max-w-md shadow-2xl border border-slate-600/30 max-h-[80vh] overflow-y-auto">
            <div class="p-6 border-b border-slate-700/50">
                <h2 id="addRuleTitle" class="text-lg font-semibold">Add Rule</h2>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">Rule Type</label>
                    <div id="ruleOptions" class="space-y-2"></div>
                </div>
                <div id="ruleConfigSection" class="hidden">
                    <label class="block text-sm text-slate-400 mb-2">Configuration</label>
                    <div id="ruleConfigFields" class="space-y-3"></div>
                </div>
            </div>
            <div class="p-6 border-t border-slate-700/50 flex gap-3">
                <button id="cancelAddRule" class="flex-1 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-medium transition-colors">Cancel</button>
                <button id="confirmAddRule" class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-medium transition-colors">Add Rule</button>
            </div>
        </div>
    </div>

    <script>
        let strategies = [];
        let currentStrategyId = null;
        let ruleTemplates = {};
        let selectedRuleType = null;
        let selectedRuleName = null;

        async function fetchAPI(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: { 'Content-Type': 'application/json', ...options.headers }
            });
            return res.json();
        }

        async function loadStrategies() {
            const data = await fetchAPI('/api/strategies');
            strategies = data.strategies || [];
            renderStrategyList();
        }

        async function loadRuleTemplates() {
            const data = await fetchAPI('/api/rule-templates');
            ruleTemplates = data.templates || {};
        }

        function renderStrategyList() {
            const list = document.getElementById('strategyList');
            if (strategies.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-12">
                        <p class="text-slate-400 mb-4">No strategies created yet</p>
                        <button onclick="showCreateModal()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-medium">Create Your First Strategy</button>
                    </div>
                `;
                return;
            }

            list.innerHTML = strategies.map(s => `
                <div class="bg-navy-700/30 rounded-xl p-4 hover:bg-navy-700/50 transition-colors cursor-pointer" onclick="viewStrategy(${s.id})">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="font-medium">${s.name}</h3>
                                ${s.is_active ? '<span class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 text-xs">Active</span>' : ''}
                            </div>
                            <p class="text-sm text-slate-400 mt-1">${s.description || 'No description'}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            ${!s.is_active ? `<button onclick="event.stopPropagation(); activateStrategy(${s.id})" class="px-3 py-1.5 bg-blue-600/20 text-blue-400 rounded-lg text-sm hover:bg-blue-600/30">Activate</button>` : ''}
                            <button onclick="event.stopPropagation(); deleteStrategy(${s.id})" class="p-2 text-red-400 hover:bg-red-500/20 rounded-lg">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function viewStrategy(id) {
            currentStrategyId = id;
            const data = await fetchAPI(`/api/strategies/${id}`);
            document.getElementById('detailName').textContent = data.name;
            document.getElementById('detailDesc').textContent = data.description || '';

            // Render rules by type
            const rules = data.rules || [];
            renderRulesList('entry', rules.filter(r => r.rule_type === 'entry'));
            renderRulesList('exit', rules.filter(r => r.rule_type === 'exit'));
            renderRulesList('sizing', rules.filter(r => r.rule_type === 'sizing'));
            renderRulesList('risk', rules.filter(r => r.rule_type === 'risk'));

            document.getElementById('strategyList').classList.add('hidden');
            document.getElementById('strategyDetail').classList.remove('hidden');
        }

        function renderRulesList(type, rules) {
            const list = document.getElementById(`${type}RulesList`);
            if (rules.length === 0) {
                list.innerHTML = '<p class="text-sm text-slate-500">No rules configured</p>';
                return;
            }

            list.innerHTML = rules.map(r => {
                const config = JSON.parse(r.rule_config || '{}');
                const configStr = Object.entries(config).map(([k, v]) => `${k}: ${v}`).join(', ');
                return `
                    <div class="flex items-center justify-between bg-navy-700/50 rounded-lg p-3">
                        <div>
                            <span class="font-medium">${r.rule_name}</span>
                            <span class="text-sm text-slate-400 ml-2">${configStr || 'defaults'}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" ${r.enabled ? 'checked' : ''} onchange="toggleRule(${r.id}, this.checked)" class="form-checkbox rounded bg-navy-600 border-slate-500">
                            </label>
                            <button onclick="deleteRule(${r.id})" class="p-1.5 text-red-400 hover:bg-red-500/20 rounded">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function activateStrategy(id) {
            await fetchAPI(`/api/strategies/${id}/activate`, { method: 'POST' });
            loadStrategies();
        }

        async function deleteStrategy(id) {
            if (!confirm('Delete this strategy?')) return;
            await fetchAPI(`/api/strategies/${id}`, { method: 'DELETE' });
            loadStrategies();
        }

        async function deleteRule(ruleId) {
            await fetchAPI(`/api/strategies/${currentStrategyId}/rules/${ruleId}`, { method: 'DELETE' });
            viewStrategy(currentStrategyId);
        }

        async function toggleRule(ruleId, enabled) {
            await fetchAPI(`/api/strategies/${currentStrategyId}/rules/${ruleId}`, {
                method: 'PATCH',
                body: JSON.stringify({ enabled })
            });
        }

        function showCreateModal() {
            document.getElementById('strategyName').value = '';
            document.getElementById('strategyDesc').value = '';
            document.getElementById('createModal').classList.remove('hidden');
        }

        async function createStrategy() {
            const name = document.getElementById('strategyName').value.trim();
            const description = document.getElementById('strategyDesc').value.trim();
            if (!name) return alert('Please enter a name');

            await fetchAPI('/api/strategies', {
                method: 'POST',
                body: JSON.stringify({ name, description })
            });
            document.getElementById('createModal').classList.add('hidden');
            loadStrategies();
        }

        function showAddRuleModal(type) {
            selectedRuleType = type;
            selectedRuleName = null;
            document.getElementById('addRuleTitle').textContent = `Add ${type.charAt(0).toUpperCase() + type.slice(1)} Rule`;

            const options = ruleTemplates[type] || [];
            document.getElementById('ruleOptions').innerHTML = options.map(opt => `
                <label class="flex items-start gap-3 p-3 bg-navy-700/50 rounded-lg cursor-pointer hover:bg-navy-700 ${selectedRuleName === opt.name ? 'ring-2 ring-blue-500' : ''}">
                    <input type="radio" name="ruleOption" value="${opt.name}" class="mt-1" onchange="selectRule('${opt.name}')">
                    <div>
                        <div class="font-medium">${opt.name.replace(/_/g, ' ')}</div>
                        <p class="text-sm text-slate-400">${opt.description}</p>
                    </div>
                </label>
            `).join('');

            document.getElementById('ruleConfigSection').classList.add('hidden');
            document.getElementById('addRuleModal').classList.remove('hidden');
        }

        function selectRule(name) {
            selectedRuleName = name;
            const template = ruleTemplates[selectedRuleType].find(t => t.name === name);
            if (!template || !template.config_schema || Object.keys(template.config_schema).length === 0) {
                document.getElementById('ruleConfigSection').classList.add('hidden');
                return;
            }

            const fields = document.getElementById('ruleConfigFields');
            fields.innerHTML = Object.entries(template.config_schema).map(([key, schema]) => `
                <div>
                    <label class="block text-sm text-slate-400 mb-1">${key}</label>
                    <input type="number" id="config_${key}" value="${schema.default || ''}" placeholder="${schema.description || ''}"
                        class="w-full bg-navy-700 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                    <p class="text-xs text-slate-500 mt-1">${schema.description || ''}</p>
                </div>
            `).join('');

            document.getElementById('ruleConfigSection').classList.remove('hidden');
        }

        async function addRule() {
            if (!selectedRuleName) return alert('Please select a rule');

            const template = ruleTemplates[selectedRuleType].find(t => t.name === selectedRuleName);
            const config = {};
            if (template && template.config_schema) {
                for (const key of Object.keys(template.config_schema)) {
                    const input = document.getElementById(`config_${key}`);
                    if (input) config[key] = parseFloat(input.value) || template.config_schema[key].default;
                }
            }

            await fetchAPI(`/api/strategies/${currentStrategyId}/rules`, {
                method: 'POST',
                body: JSON.stringify({
                    rule_type: selectedRuleType,
                    rule_name: selectedRuleName,
                    rule_config: JSON.stringify(config)
                })
            });

            document.getElementById('addRuleModal').classList.add('hidden');
            viewStrategy(currentStrategyId);
        }

        // Event listeners
        document.getElementById('newStrategyBtn').onclick = showCreateModal;
        document.getElementById('cancelCreate').onclick = () => document.getElementById('createModal').classList.add('hidden');
        document.getElementById('confirmCreate').onclick = createStrategy;
        document.getElementById('backToListBtn').onclick = () => {
            document.getElementById('strategyDetail').classList.add('hidden');
            document.getElementById('strategyList').classList.remove('hidden');
            currentStrategyId = null;
        };
        document.getElementById('runBacktestBtn').onclick = () => {
            window.location.href = `/backtest?strategy_id=${currentStrategyId}`;
        };

        document.querySelectorAll('.add-rule-btn').forEach(btn => {
            btn.onclick = () => showAddRuleModal(btn.dataset.type);
        });

        document.getElementById('cancelAddRule').onclick = () => document.getElementById('addRuleModal').classList.add('hidden');
        document.getElementById('confirmAddRule').onclick = addRule;

        document.querySelectorAll('.collapsible-btn').forEach(btn => {
            btn.onclick = () => {
                const section = btn.dataset.section;
                const content = document.getElementById(`${section}Rules`);
                content.classList.toggle('open');
                btn.querySelector('svg').classList.toggle('rotate-180');
            };
        });

        // Initialize
        loadStrategies();
        loadRuleTemplates();
    </script>
</body>
</html>
